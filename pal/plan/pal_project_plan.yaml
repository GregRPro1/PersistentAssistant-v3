  - id: PAL-011
    title: Offline-safe idea capture -> promote-to-task flow
    status: todo
    dod:
    - ideas/*.md -> YAML task with ID
    - UI workflow
  - id: PAL-012
    title: AuthN/AuthZ (GitHub OAuth or signed links)
