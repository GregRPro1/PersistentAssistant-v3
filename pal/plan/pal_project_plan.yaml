- id: P6
  name: Desktop Base App (Optional)
  priority: 3
  tasks:
  - id: PAL-050
    title: Qt base shell integrating phone UI and logs
    status: todo
    dod:
    - embed web view
    - health indicators
governance:
  gates:
  - No code lands without passing CI checks and remote approval.
  - Releases are immutable; watchdog can revert to last _good.
  - All files must include header with author/company/date.
kill_switch:
- If metrics do not improve after two sprints, pause adapters and focus on phone/web
  stability and SSOT quality.
risks:
- 'Legacy drag: mitigated by strict legacy/ quarantine and harvest-on-demand.'
- 'Provider churn: mitigated by adapter pattern for LLMs.'
- 'Mobile auth complexity: start with GitHub OAuth; move to signed links if needed.'
