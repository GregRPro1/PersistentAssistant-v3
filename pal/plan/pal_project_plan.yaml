project: PAL
name: Persistent Assistant Lite
version: 0.1.0
created: 2025-10-11
owner: G. Rapson (GR-Analysis)
goals:
- Provide a rock-solid phone/web control surface backed by YAML SSOT.
- Enable remote approvals and idea capture from phone and laptop.
- 'Minimize churn via hard gates: tests, schema, headers, approvals.'
- Leverage best-in-class agent coders via provider-agnostic adapters.
- Keep PAL lean; treat legacy code as harvest-only.
principles:
- YAML is the Single Source of Truth (SSOT).
- 'Everything behind a gate: validate → approve → merge.'
- Releases are atomic; watchdog can rollback automatically.
- Spec/plan first; code second.
- Provider-agnostic adapters for LLMs.
success_metrics:
- '>= 30% reduction in rework commits/PR vs. last month baseline.'
- 100% PRs gated by tests + schema + headers + remote approval.
- Median PR lead-time reduced by 25%.
- Cold boot to ready (phone UI connected) <= 20s.
repo_layout:
  root_files:
  - PA_CONSTITUTION.md (quality bar & coding standards)
  directories:
  - 'pal/core/         # schemas, validators, health'
  - 'pal/pipelines/    # doc->yaml, plan/chunk, execute, validate, PR'
  - 'pal/adapters/llm/ # provider-agnostic LLM adapters'
  - 'pal/adapters/vcs/ # GitHub checks/status/env approvals'
  - 'pal/ui/web/       # FastAPI + WebSocket app (phone/laptop UI)'
  - 'pal/ui/desktop/   # minimal desktop shell/launcher'
  - 'pal/scripts/ps/   # PowerShell wrappers (implement, approve)'
  - 'pal/ci/           # CI workflows and tests'
  - 'legacy/           # quarantined old code for harvesting'
phases:
- id: M0
  name: Phone/Web Link Reliability (Unbreakable)
  priority: 1
  objective: Phone/web UI connects in <=20s; watchdog rollbacks on failure.
  tasks:
  - id: PAL-100
    title: Scaffold release layout + symlinked 'current'
    priority: 1
    status: done
    dod:
    - releases/<ver>/ present
    - current -> releases/<ver>
    - run.ps1 boots server
  - id: PAL-101
    title: PAL-Web FastAPI + WS endpoints
    priority: 1
    status: review
    dod:
    - GET /healthz -> 200 {version}
    - GET /projects/:id/tree -> YAML JSON
    - WS /ws/:id broadcasts on file change
  - id: PAL-102
    title: YAML SSOT atomic IO (pydantic + atomic writes)
    priority: 1
    status: review
    dod:
    - temp-write+fsync+move
    - optimistic version field
    - unit tests
  - id: PAL-103
    title: Minimal desktop launcher (tray/window)
    priority: 2
    status: review
    dod:
    - Start/Stop, status, 'Open UI'
    - reads env.json
  - id: PAL-104
    title: Watchdog + scheduled task + rollback
    priority: 1
    status: review
    dod:
    - auto-rollback to last _good
    - EventLog entries
    - E2E verified
  - id: PAL-105
    title: Health & rollback E2E tests (CI)
    priority: 1
    status: review
    dod:
    - boot test <=20s
    - rollback test flips current back
  - id: PAL-106
    title: Approval & ideas endpoints (finish the small bits)
    priority: 1
    status: review
    dod:
    - POST /approve {specId, commit} → sets GH status/check
    - POST /ideas {text} -> markdown; emits WS update
    - Mobile UI buttons wired and tested
- id: P1
  name: Cutover & SSOT Hardening
  priority: 1
  tasks:
  - id: PAL-001
    title: Quarantine legacy tree and create PAL skeleton
    status: todo
    dod:
