name: CI (Windows)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-test-pack:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip wheel setuptools

      - name: Install requirements (best-effort)
        run: |
          if (Test-Path requirements.txt) { pip install -r requirements.txt } else { Write-Host "No requirements.txt" }
          if (Test-Path requirements-dev.txt) { pip install -r requirements-dev.txt } else { Write-Host "No requirements-dev.txt" }

      - name: Self-check + forbidden-guard
        run: |
          if (Test-Path tools\self_check.py) { python tools\self_check.py } else { Write-Host "[SKIP] self_check.py" }
          if (Test-Path tools\forbidden_guard.py) { python tools\forbidden_guard.py --mode=ci } else { Write-Host "[SKIP] forbidden_guard.py" }

      - name: Export insights
        run: |
          if (Test-Path tools\export_insights.py) { python tools\export_insights.py } else { Write-Host "[SKIP] export_insights.py" }

      - name: Start LEB (background)
        shell: pwsh
        run: |
          if (Test-Path tools\leb_server.py) {
            New-Item -ItemType Directory -Force tmp\logs | Out-Null
            $wd  = "$env:GITHUB_WORKSPACE"
            $out = "tmp\logs\leb_stdout.log"
            $err = "tmp\logs\leb_stderr.log"

            # Start as a detached process that survives this step
            $p = Start-Process -FilePath "python" `
                              -ArgumentList "tools\leb_server.py" `
                              -WorkingDirectory $wd `
                              -RedirectStandardOutput $out `
                              -RedirectStandardError  $err `
                              -PassThru

            # Save PID for later Stop step
            "$($p.Id)" | Set-Content leb_pid.txt

            # Wait for the HTTP ping to be ready
            $ok = $false
            1..30 | ForEach-Object {
              try {
                $r = Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 -Uri "http://127.0.0.1:8765/ping"
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ok) {
              Write-Host "---- leb_stderr.log (tail) ----"
              Get-Content $err -Tail 200 -ErrorAction SilentlyContinue
              throw "LEB did not respond to /ping"
            }
          } else {
            Write-Host "[SKIP] tools\leb_server.py not present"
          }


      - name: Probe LEB
        run: |
          if (Test-Path tools\ci_probe.py) { python tools\ci_probe.py } else { Write-Host "[SKIP] ci_probe.py" }

      - name: Stop LEB
        if: always()
        shell: pwsh
        run: |
          if (Test-Path leb_pid.txt) {
            $pid = Get-Content leb_pid.txt
            Write-Host "Stopping LEB PID $pid"
            Stop-Process -Id $pid -Force -ErrorAction SilentlyContinue
          }

      - name: Upload LEB logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: leb-logs
          path: tmp\logs\*
          if-no-files-found: ignore


      - name: Apply+Pack (no replace)
        run: |
          if (Test-Path tools\apply_and_pack.py) {
            python tools\apply_and_pack.py
          } else {
            Write-Host "[SKIP] apply_and_pack.py"
          }

      - name: Upload packs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-packs
          path: tmp\feedback\*.zip
          if-no-files-found: warn
