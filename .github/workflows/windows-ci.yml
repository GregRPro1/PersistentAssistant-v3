name: Windows CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: "Win ${{ matrix.python-version }}"
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.12", "3.13" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt', 'pyproject.toml', 'setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -U pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          if (Test-Path requirements-dev.txt) { pip install -r requirements-dev.txt }
          if (Test-Path pyproject.toml) { pip install -e . 2>$null; if ($LASTEXITCODE -ne 0) { Write-Host "editable install skipped" } }
          pip install pytest

      - name: Run unit tests
        shell: pwsh
        env:
          PYTHONWARNINGS: error::SyntaxWarning
        run: pytest -q

      - name: Local CI gate
        shell: pwsh
        run: python tools\py\ci\ci_check.py

      - name: Upload snapshot pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-pack-${{ matrix.python-version }}
          path: tmp\feedback\pack_project_snapshot_*.zip
          if-no-files-found: ignore
