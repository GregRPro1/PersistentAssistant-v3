# PAL centralized settings with lifecycle policies
ports:
  watchdog_ui: 9001
  dev_server: 8787
  tracker: 9002
paths:
  repo_root: C:\_Repos\PersistentAssistant
  tracker_script: C:\_Repos\PersistentAssistant\scripts\tracker\pal_tracker.py
lifecycle:
  check_interval_sec: 30
  restart_limit_count: 3
  restart_limit_window_sec: 300
  backoff_sec: 120
  auto_run_smoke: true
  auto_git_push: true
autostart:
  enabled: false   # toggle via file; watchdog_ui shows button to apply
  task_name: PAL_Watchdog
  # When enabled, we register a per-user scheduled task to run watchdog_ui.py at logon.
