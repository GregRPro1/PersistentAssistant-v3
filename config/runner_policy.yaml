ai_apply:
  enabled: true
  require_feature_id: true
  require_before_sha: true

apply_enabled: true
require_before_sha: true

limits:
  max_files: 10
  max_total_bytes: 200000
  max_hunks_per_file: 20

allow_globs:
  - "docs/USER_GUIDE.md"
  - "tests/**"
  - "server/**"
  - "tools/**"
  - "project/**"

deny_globs:
  - "tmp/**"
  - ".git/**"
  - "**/*.exe"
  - "**/*.dll"
  - "**/*.bin"
  - "**/*.png"
  - "**/*.jpg"
  - "data/interactions/**"

backups:
  enabled: true
  dir: "tmp/backups"
