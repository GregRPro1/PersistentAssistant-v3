# config/runner_policy.yaml
ai_apply:
  enabled: false # flip to true to allow writes, or pass --really-apply
  require_feature_id: true # enforce Feature-ID for audit

limits:
  max_files: 10
  max_total_bytes: 200000
  max_hunks_per_file: 20
  tokens_per_day: 100000 # placeholder, enforce in UI/runner as needed

allow_globs:
  - "web/**"
  - "server/**"
  - "tools/**"
  - "docs/**"
  - "project/**"

deny_globs:
  - "tmp/**"
  - ".git/**"
  - "**/*.exe"
  - "**/*.dll"
  - "**/*.bin"
  - "**/*.png"
  - "**/*.jpg"
  - "data/interactions/**"

backups:
  enabled: true
  dir: "tmp/backups"
