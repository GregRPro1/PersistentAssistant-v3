# Provider/model selection used by the agent registry.
# You can override via env:
#   AI_PROVIDER, AI_MODEL (used as default fallback)
default:
  provider: openai
  model: gpt-4o-mini

roles:
  strategy:
    provider: openai
    model: gpt-4o-mini
  review:
    provider: openai
    model: gpt-4o-mini
  introspection:
    provider: openai
    model: gpt-4o-mini
  coding:
    provider: openai
    model: gpt-4o-mini
  docs:
    provider: openai
    model: gpt-4o-mini
